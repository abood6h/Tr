<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الراديو</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#12141a;color:#eee;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:0 0 12px}
.card{background:#1e222b;border-radius:12px;padding:14px;margin:10px 0}
button{background:#5865f2;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
button.red{background:#c0392b}button.green{background:#2e8b57}button.gray{background:#3a3f4b}
.room{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#3a3f4b;margin-inline-start:6px}
.mil{background:#2e8b57}
#ptt{width:100%;padding:22px;font-size:18px;margin-top:8px}
#ptt.on{background:#2e8b57}
.hide{display:none}
</style>
</head>
<body>
<h1>📻 الراديو</h1>
<div id="login" class="card hide"><p>سجّل دخولك بديسكورد عشان يتحقق من رتبتك.</p><button onclick="login()">دخول بـ Discord</button></div>
<div id="home" class="hide"><div class="card"><span id="who"></span><span id="rank" class="tag"></span></div><div id="rooms"></div></div>
<div id="inroom" class="hide">
  <div class="card"><b id="rname"></b> <button class="gray" onclick="leave()" style="float:left">خروج</button></div>
  <div class="card"><b>المتصلين:</b><div id="plist"></div></div>
  <div id="reqs"></div>
  <button id="ptt" class="gray hide">🎙️ اضغط مطوّلاً للتكلم</button>
  <button id="askmic" class="gray hide" style="width:100%;margin-top:8px" onclick="askMic()">✋ اطلب المايك</button>
</div>
<div id="audios"></div>

<script>
/* ===== الإعدادات: عدّلها ===== */
const CLIENT_ID = "1568272191936790669";
const GUILD_ID = "1539659625584918659";
const MILITARY_ROLE_IDS = ["1543227588514680882","1543227661726253106","1568294804687945768"]; // قائد الشرطة، فريق، عسكري
const APP = "alsaqr-radio-7429"; // غيّره لاسم مميز (عشان ما تتعارض غرفك مع غيرك)
const ROOMS = [
  {id:"public", name:"الراديو العام", mil:false},
  {id:"mil1", name:"موجة العساكر 1", mil:true},
  {id:"mil2", name:"موجة العساكر 2", mil:true},
  {id:"mil3", name:"موجة العساكر 3", mil:true}
];
/* ============================= */

const $=id=>document.getElementById(id);
const show=(...a)=>{["login","home","inroom"].forEach(x=>$(x).classList.add("hide"));a.forEach(x=>$(x).classList.remove("hide"))};
let me=null, peer, room, mic, canTalk=false, peers=[], hostConns={}, hostConn=null, isHost=false, called={}, reqs={};

function login(){
  const u="https://discord.com/oauth2/authorize?client_id="+CLIENT_ID+"&response_type=token&redirect_uri="+encodeURIComponent(location.origin+location.pathname)+"&scope="+encodeURIComponent("identify guilds.members.read");
  location.href=u;
}

async function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  const tok=h.get("access_token")||sessionStorage.getItem("tok");
  if(!tok){show("login");return}
  sessionStorage.setItem("tok",tok);
  history.replaceState(null,"",location.pathname);
  try{
    const H={headers:{Authorization:"Bearer "+tok}};
    const u=await (await fetch("https://discord.com/api/users/@me",H)).json();
    if(!u.id) throw 0;
    let mil=false;
    const r=await fetch("https://discord.com/api/users/@me/guilds/"+GUILD_ID+"/member",H);
    if(r.ok){const m=await r.json();mil=(m.roles||[]).some(x=>MILITARY_ROLE_IDS.includes(x))}
    me={id:u.id,name:u.global_name||u.username,mil};
    $("who").textContent=me.name;
    $("rank").textContent=mil?"عسكري":"مدني";
    $("rank").className="tag "+(mil?"mil":"");
    renderRooms();show("home");
  }catch(e){sessionStorage.removeItem("tok");show("login")}
}

function renderRooms(){
  $("rooms").innerHTML="";
  ROOMS.filter(r=>!r.mil||me.mil).forEach(r=>{
    const d=document.createElement("div");d.className="card room";
    d.innerHTML="<span>"+r.name+(r.mil?'<span class="tag mil">عسكري</span>':"")+"</span>";
    const b=document.createElement("button");b.textContent="دخول";b.onclick=()=>join(r);
    d.appendChild(b);$("rooms").appendChild(d);
  });
}

async function join(r){
  try{mic=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){alert("لازم تسمح بالمايك");return}
  mic.getAudioTracks()[0].enabled=false;
  room=r;canTalk=me.mil;called={};reqs={};peers=[];hostConns={};isHost=false;
  $("rname").textContent=r.name;
  const hid="radio-"+APP+"-"+r.id;
  peer=new Peer(hid);
  peer.on("open",()=>{isHost=true;peers=[{id:hid,name:me.name,mil:me.mil}];setup();ui()});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){
      peer=new Peer();
      peer.on("open",()=>{
        setup();
        hostConn=peer.connect(hid,{reliable:true});
        hostConn.on("open",()=>hostConn.send({t:"join",name:me.name,mil:me.mil}));
        hostConn.on("data",onData);
        hostConn.on("close",()=>{alert("صاحب الغرفة طلع");leave()});
      });
    }
  });
  show("inroom");
}

function setup(){
  peer.on("call",c=>{c.answer(mic);c.on("stream",s=>play(c.peer,s))});
  if(isHost) peer.on("connection",c=>{
    hostConns[c.peer]=c;
    c.on("data",d=>hostData(d,c));
    c.on("close",()=>{delete hostConns[c.peer];peers=peers.filter(p=>p.id!==c.peer);bcast()});
  });
}

function hostData(d,c){
  if(d.t==="join"){peers.push({id:c.peer,name:d.name,mil:d.mil});bcast()}
  if(d.t==="req"){
    Object.values(hostConns).forEach(x=>{const p=peers.find(p=>p.id===x.peer);if(p&&p.mil)x.send({t:"req",id:c.peer,name:d.name})});
    if(me.mil) onData({t:"req",id:c.peer,name:d.name});
  }
  if(d.t==="grant"){
    if(d.to===peer.id) onData({t:"grant"});
    else if(hostConns[d.to]) hostConns[d.to].send({t:"grant"});
  }
}

function bcast(){
  Object.values(hostConns).forEach(c=>c.send({t:"peers",list:peers}));
  onData({t:"peers",list:peers});
}

function onData(d){
  if(d.t==="peers"){
    peers=d.list;
    const idx=peers.findIndex(p=>p.id===peer.id);
    for(let i=0;i<idx;i++) callPeer(peers[i].id);
    ui();
  }
  if(d.t==="req"){reqs[d.id]=d.name;ui()}
  if(d.t==="grant"){canTalk=true;ui()}
}

function callPeer(id){
  if(called[id])return;called[id]=1;
  const c=peer.call(id,mic);
  c.on("stream",s=>play(id,s));
}

function play(id,s){
  let a=document.getElementById("a"+id);
  if(!a){a=document.createElement("audio");a.id="a"+id;a.autoplay=true;$("audios").appendChild(a)}
  a.srcObject=s;a.play().catch(()=>{});
}

function askMic(){
  if(isHost) hostData({t:"req",name:me.name},{peer:peer.id});
  else hostConn.send({t:"req",name:me.name});
  $("askmic").textContent="تم إرسال الطلب ⏳";
}

function grant(id){
  delete reqs[id];
  if(isHost) hostData({t:"grant",to:id},{});
  else hostConn.send({t:"grant",to:id});
  ui();
}

function ui(){
  $("plist").innerHTML=peers.map(p=>"<div>"+esc(p.name)+(p.mil?'<span class="tag mil">عسكري</span>':"")+"</div>").join("");
  $("reqs").innerHTML="";
  if(me.mil) Object.entries(reqs).forEach(([id,n])=>{
    const d=document.createElement("div");d.className="card room";
    d.innerHTML="<span>✋ "+esc(n)+" يطلب المايك</span>";
    const b=document.createElement("button");b.className="green";b.textContent="موافقة";b.onclick=()=>grant(id);
    d.appendChild(b);$("reqs").appendChild(d);
  });
  $("ptt").classList.toggle("hide",!canTalk);
  $("askmic").classList.toggle("hide",canTalk);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";")}

function leave(){
  try{peer.destroy()}catch(e){}
  if(mic)mic.getTracks().forEach(t=>t.stop());
  $("audios").innerHTML="";$("askmic").textContent="✋ اطلب المايك";
  show("home");
}

const ptt=$("ptt"),tr=()=>mic.getAudioTracks()[0];
const on=e=>{e.preventDefault();if(canTalk){tr().enabled=true;ptt.classList.add("on")}};
const off=e=>{e.preventDefault();tr().enabled=false;ptt.classList.remove("on")};
["mousedown","touchstart"].forEach(v=>ptt.addEventListener(v,on));
["mouseup","mouseleave","touchend"].forEach(v=>ptt.addEventListener(v,off));

init();
</script>
</body>
</html>
